<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .fondo {
            position: absolute;
            inset: 0;
            background: url('https://i.ytimg.com/vi/MPbS7Whh2K0/hq720.jpg?sqp=-oaymwE7CK4FEIIDSFryq4qpAy0IARUAAAAAGAElAADIQj0AgKJD8AEB-AH-CYAC0AWKAgwIABABGGQgZChkMA8=&rs=AOn4CLDByrU_NIcX-Bxbf2o8_s8cCvcouw') center center / cover no-repeat;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .card {
            position: relative;
            z-index: 3;
            background: rgba(25, 25, 25, 0.85);
            padding: 30px;
            border-radius: 20px
        }
    </style>
</head>
<body>
    <div class="fondo"></div>
    <div class="overlay"></div>
    <div class="card">
        <!-- Aquí va tu contenido -->
    </div>
</body>
</html>
