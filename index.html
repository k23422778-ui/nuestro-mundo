<style>

/* =========================================================
   FUENTE
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      #171717 0%,
      #080808 48%,
      #010101 100%
    );

  color:#d8d8d8;

  font-family:'Share Tech Mono',monospace;
}


/* =========================================================
   HABITACIÓN
========================================================= */

.room{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:15px;
}

.room::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.055),
      transparent 65%
    );
}


/* =========================================================
   MONITOR
========================================================= */

.monitor{
  position:relative;

  width:min(920px,96vw);
  height:min(760px,96vh);

  padding:16px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #2b2b2b,
      #111 45%,
      #070707
    );

  box-shadow:
    0 40px 100px rgba(0,0,0,.95),
    inset 0 0 0 2px #303030,
    inset 0 0 35px rgba(0,0,0,.95);

  animation:monitorAppear 1.5s ease-out;
}

.monitor::before{
  content:"";

  position:absolute;
  inset:-5px;

  border-radius:27px;

  border:1px solid #343434;

  pointer-events:none;
}


/* =========================================================
   PANTALLA
========================================================= */

.screen{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:12px;

  background:
    radial-gradient(
      ellipse at center,
      #242424 0%,
      #101010 55%,
      #050505 100%
    );

  box-shadow:
    inset 0 0 50px rgba(0,0,0,.95),
    inset 0 0 15px rgba(255,255,255,.04);

  animation:screenFlicker 5s infinite;
}


/* =========================================================
   EFECTO CRT
========================================================= */

.screen::before{
  content:"";

  position:absolute;
  inset:0;

  z-index:50;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 2px,
      transparent 4px
    );

  mix-blend-mode:screen;
}

.screen::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:51;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.78) 100%
    );
}


/* =========================================================
   RUIDO
========================================================= */

.noise{
  position:absolute;
  inset:0;

  z-index:40;

  pointer-events:none;

  opacity:.07;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      rgba(255,255,255,.3) 1px,
      transparent 2px
    );

  animation:noiseMove .15s infinite;
}

.scanline{
  position:absolute;

  left:0;

  width:100%;
  height:2px;

  z-index:39;

  background:rgba(220,220,220,.08);

  box-shadow:
    0 0 12px rgba(255,255,255,.08);

  animation:scan 6s linear infinite;
}


/* =========================================================
   INTERFAZ
========================================================= */

.interface{
  position:relative;

  z-index:10;

  height:100%;

  padding:5% 7%;

  display:flex;
  flex-direction:column;

  justify-content:space-between;
}


/* =========================================================
   TOP
========================================================= */

.top{
  display:flex;

  justify-content:space-between;
  align-items:center;

  font-size:clamp(.62rem,1.5vw,.9rem);

  letter-spacing:2px;

  color:#999;
}

.online{
  display:flex;

  align-items:center;

  gap:8px;
}

.indicator{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#8f1717;

  box-shadow:
    0 0 8px rgba(180,20,20,.8);

  animation:blink 2s infinite;
}


/* =========================================================
   CONTENIDO
========================================================= */

.content{
  text-align:center;

  width:100%;
  height:68%;

  overflow-y:auto;

  padding:20px;

  scrollbar-width:thin;

  scrollbar-color:#555 transparent;
}

.content::-webkit-scrollbar{
  width:5px;
}

.content::-webkit-scrollbar-thumb{
  background:#555;
}


/* =========================================================
   TEXTO PRINCIPAL
========================================================= */

.classification{
  color:#888;

  font-size:clamp(.7rem,2vw,1rem);

  letter-spacing:4px;

  margin-bottom:18px;
}

.file-number{
  color:#b7b7b7;

  font-size:clamp(.65rem,1.5vw,.9rem);

  letter-spacing:3px;

  margin-bottom:8px;
}

.subject{
  position:relative;

  display:inline-block;

  font-size:clamp(2.8rem,11vw,6rem);

  letter-spacing:8px;

  font-weight:normal;

  color:#d7d7d7;

  text-shadow:
    0 0 10px rgba(255,255,255,.08),
    2px 0 rgba(120,0,0,.35);

  animation:subtleGlitch 6s infinite;
}

.status{
  margin-top:12px;

  font-size:clamp(.7rem,2vw,1rem);

  letter-spacing:3px;

  color:#a7a7a7;
}

.status strong{
  color:#a11e1e;

  font-weight:normal;
}


/* =========================================================
   WARNING
========================================================= */

.warning{
  margin-top:35px;

  display:inline-block;

  border:1px solid #541717;

  padding:14px 25px;

  color:#aaa;

  background:rgba(70,0,0,.08);

  box-shadow:
    inset 0 0 20px rgba(100,0,0,.08),
    0 0 15px rgba(80,0,0,.08);

  animation:warningPulse 3s infinite;
}

.warning-title{
  color:#9d2020;

  font-size:.75rem;

  letter-spacing:3px;

  margin-bottom:8px;
}

.warning-text{
  font-size:clamp(.8rem,2vw,1rem);

  letter-spacing:1px;
}


/* =========================================================
   BOTONES
========================================================= */

button{
  padding:12px 22px;

  margin:7px;

  border:1px solid #666;

  background:
    linear-gradient(
      180deg,
      rgba(30,30,30,.8),
      rgba(0,0,0,.75)
    );

  color:#cfcfcf;

  font-family:inherit;

  font-size:clamp(.68rem,2vw,.9rem);

  letter-spacing:2px;

  cursor:pointer;

  transition:
    background .2s ease,
    border .2s ease,
    transform .15s ease,
    box-shadow .2s ease;

  position:relative;

  overflow:hidden;
}

button::after{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:80%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.08),
      transparent
    );

  transition:left .4s ease;
}

button:hover::after{
  left:130%;
}

button:hover{
  background:
    linear-gradient(
      180deg,
      rgba(80,0,0,.35),
      rgba(20,0,0,.8)
    );

  border-color:#9d2020;

  box-shadow:
    0 0 18px rgba(120,0,0,.25);

  transform:translateY(-2px);
}

button:active{
  transform:scale(.96);
}


/* =========================================================
   EFECTO RESIDENT EVIL / BIOHAZARD
========================================================= */

.screen.buttonImpact{
  animation:
    buttonShake .22s linear,
    redPulse .35s ease-out;
}

.screen.buttonImpact::after{
  box-shadow:
    inset 0 0 120px rgba(140,0,0,.8);
}

.biohazardFlash{
  position:fixed;

  inset:0;

  z-index:999;

  pointer-events:none;

  background:
    rgba(130,0,0,.28);

  opacity:0;

  animation:biohazardFlash .35s ease-out;
}

.glitchOverlay{
  position:fixed;

  inset:0;

  z-index:998;

  pointer-events:none;

  opacity:0;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      rgba(180,0,0,.12) 2px,
      transparent 4px

  animation:glitchFlash .25s linear;
}


/* =========================================================
   MENU
========================================================= */

.mainMenu{

.mainMenu h2{

.mainMenu p{

/* =========================================================

/* =========================================================

.bar:nth-child(4){

/* =========================================================
   PROGRESO
========================================================= */

.progressBox{
  width:90%;

  max-width:450px;

  margin:25px auto;

  border:1px solid #3c3c3c;

  padding:15px;
}

.progressBar{

  height:10px;

  background:#111;

  border:1px solid #444;

  margin-top:10px;
}

.progressFill{
  width:0%;

  height:100%;

  background:#8f1717;

  box-shadow:
    0 0 10px rgba(150,0,0,.5);

  transition:width .4s ease;
}


/* =========================================================
   ANIMACIONES
========================================================= */

@keyframes monitorAppear{

  from{
    opacity:0;

    transform:scale(.96);
  }

  to{
    opacity:1;

    transform:scale(1);
  }

}

@keyframes screenFlicker{

  0%,100%{
    opacity:1;
  }

  48%{
    opacity:1;
  }

  49%{
    opacity:.94;
  }

  50%{
    opacity:1;
  }

  83%{
    opacity:1;
  }

  84%{
    opacity:.96;
  }

}

@keyframes noiseMove{

  0%{
    transform:translateY(0);
  }

  100%{
    transform:translateY(4px);
  }

}

@keyframes scan{

  from{
    top:-5%;
  }

  to{
    top:105%;
  }

}

@keyframes blink{

  0%,45%{
    opacity:1;
  }

  50%,55%{
    opacity:.25;
  }

  60%,100%{
    opacity:1;
  }

}

@keyframes warningPulse{

  0%,100%{
    opacity:.85;
  }

  50%{
    opacity:1;
  }

}

@keyframes subtleGlitch{

  0%,94%,100%{
    transform:translateX(0);
  }

  95%{
    transform:translateX(-2px);
  }

  96%{
    transform:translateX(2px);
  }

  97%{
    transform:translateX(0);
  }

}

@keyframes buttonShake{

  0%{
    transform:translate(0,0);
  }

  20%{
    transform:translate(-3px,1px);
  }

  40%{
    transform:translate(3px,-1px);
  }

  60%{
    transform:translate(-2px,0);
  }

  80%{
    transform:translate(2px,1px);
  }

  100%{
    transform:translate(0,0);
  }

}

@keyframes redPulse{

  0%{
    box-shadow:
      inset 0 0 50px rgba(0,0,0,.95);
  }

  45%{
    box-shadow:
      inset 0 0 150px rgba(120,0,0,.55);
  }

  100%{
    box-shadow:
      inset 0 0 50px rgba(0,0,0,.95);
  }

}

@keyframes biohazardFlash{

  0%{
    opacity:0;
  }

  25%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

@keyframes glitchFlash{

  0%{
    opacity:0;

    transform:translateX(0);
  }

  20%{
    opacity:1;

    transform:translateX(-4px);
  }

  40%{
    opacity:.5;

    transform:translateX(5px);
  }

  60%{
    opacity:1;

    transform:translateX(-2px);
  }

  100%{
    opacity:0;

    transform:translateX(0);
  }

}

  }

  .menuButton{

/* =========================================================

@media(max-width:380px){

  }

}

<script>

/* =========================================================
   VARIABLES
========================================================= */

let secretMemoryUnlocked = false;


/* =========================================================
   EFECTO DE BOTÓN
========================================================= */

function buttonEffect(){

  const screen =
    document.getElementById("screen");

  if(screen){

    screen.classList.remove("buttonImpact");

    void screen.offsetWidth;

    screen.classList.add("buttonImpact");

  }


  const flash =
    document.createElement("div");

  flash.className =
    "biohazardFlash";

  document.body.appendChild(flash);


  const glitch =
    document.createElement("div");

  glitch.className =
    "glitchOverlay";

  document.body.appendChild(glitch);


  setTimeout(() => {

    flash.remove();

    glitch.remove();

  },500);


  playTerminalSound();

}


/* =========================================================
   SONIDO
========================================================= */

function playTerminalSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      "square";

    oscillator.frequency.setValueAtTime(
      120,
      ctx.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      55,
      ctx.currentTime + .12
    );

    gain.gain.setValueAtTime(
      .05,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .12
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + .12
    );

  }catch(error){

    console.log("Audio unavailable.");

  }

}

        <h2>
          💗 CONCLUSIÓN
        </h2>

        <p>
          Hikari no puede ser clasificada
          como una simple memoria.
        </p>

        <p>
          Ella es parte de la historia.
        </p>

        <p>
          Y esta historia todavía
          se está escribiendo.
        </p>

        <h2>
          ⚠️ SISTEMA INESTABLE
        </h2>

        <p>
          Se ha detectado un último registro.
        </p>

        <br>

        <button onclick="showFinalMessage()">
          💌 ABRIR ÚLTIMO REGISTRO
        </button>

      </div>

    </div>

  `);


  let progress = 0;


  const interval =
    setInterval(() => {

      progress += 25;


      const loading =
        document.getElementById(
          "finalLoading"
        );


      if(!loading){

        clearInterval(interval);

        return;

      }


      loading.innerHTML =

        "█".repeat(progress / 6.25) +

        "░".repeat(
          16 - progress / 6.25
        ) +

        " " +

        progress +

        "%";


      if(progress >= 100){

        clearInterval(interval);


        setTimeout(() => {

          loading.innerHTML =
            "✅ ANÁLISIS COMPLETADO";


          setTimeout(() => {

            document.getElementById(
              "finalContent"
            ).style.display =
              "block";

          },1200);


        },700);

      }

    },1000);

}
