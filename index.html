<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil: Requiem — Para mi novia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier Prime', monospace;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .menu-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1f1f1f 100%);
            background-image: 
                linear-gradient(rgba(20,20,20,0.85), rgba(30,30,30,0.9)),
                url('https://images.unsplash.com/photo-1504639725590-34d0984388bd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1974&q=80');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7) contrast(1.1);
            z-index: 1;
        }
        .contenido-menu {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }
        .logo-container {
            margin-bottom: 4rem;
        }
        .titulo-principal {
            font-size: 2.2rem;
            letter-spacing: 0.4em;
            color: #ffffff;
            font-weight: 400;
            text-transform: uppercase;
        }
        .titulo-requiem {
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: lowercase;
            color: #f0f0f0;
            position: relative;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .titulo-requiem::after {
            content: '';
            position: absolute;
            left: -5%;
            top: 15%;
            width: 110%;
            height: 70%;
            background: rgba(40, 40, 40, 0.6);
            transform: skewX(-8deg);
            border-top: 2px solid rgba(255,255,255,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            z-index: -1;
        }
        .modo-container {
            display: flex;
            gap: 3rem;
            align-items: flex-start;
            margin-bottom: 4rem;
        }
        .etiqueta-modo {
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: #b0b0b0;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .lista-modos {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .modo {
            font-size: 1.1rem;
            padding: 0.5rem 2rem 0.5rem 0;
            color: #909090;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .modo.activo {
            color: #ffffff;
            font-weight: 700;
        }
        .modo.activo::before {
            content: '▶';
            position: absolute;
            left: -1.5rem;
            color: #fff;
        }
        .modo:hover {
            color: #ffffff;
        }
        .descripcion-modo {
            max-width: 300px;
            padding-top: 0.5rem;
        }
        .descripcion-modo p {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .acciones-menu {
            margin-top: 2rem;
        }
        .btn-menu {
            font-family: 'Courier Prime', monospace;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            background: transparent;
            border: 1px solid #666;
            color: #e0e0e0;
            padding: 1rem 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            color: #ffffff;
        }
        .controles-pie {
            position: absolute;
            bottom: 2.5rem;
            left: 4rem;
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            color: #777;
        }
        @media (max-width: 768px) {
            .contenido-menu { padding: 2rem; }
            .titulo-principal { font-size: 1.5rem; }
            .titulo-requiem { font-size: 3rem; }
            .modo-container { flex-direction: column; gap: 1.5rem; }
            .controles-pie { left: 2rem; }
        }
    </style>
</head>
<body>
    <div class="menu-fondo"></div>
    <div class="contenido-menu">
        <div class="logo-container">
            <h1 class="titulo-principal">RESIDENT EVIL</h1>
            <h2 class="titulo-requiem">requiem</h2>
        </div>
        <div class="modo-container">
            <div>
                <p class="etiqueta-modo">GAME MODE</p>
                <div class="lista-modos">
                    <div class="modo activo" data-modo="casual"><span>Casual</span></div>
                    <div class="modo" data-modo="standard-moderno"><span>Standard (Modern)</span></div>
                    <div class="modo" data-modo="standard-clasico"><span>Standard (Classic)</span></div>
                    <div class="modo" data-modo="insanity"><span>Insanity</span></div>
                </div>
            </div>
            <div class="descripcion-modo">
                <p id="texto-descripcion">Relax while enjoying the story and puzzles.</p>
            </div>
        </div>
        <div class="acciones-menu">
            <button id="btn-jugar" class="btn-menu">▶ EMPEZAR AVENTURA</button>
        </div>
        <div class="controles-pie">
            <span>X Confirm</span>
            <span>O Back</span>
        </div>
    </div>
    <script>
        const modos = document.querySelectorAll('.modo');
        const textoDescripcion = document.getElementById('texto-descripcion');
        const btnJugar = document.getElementById('btn-jugar');
        const descripciones = {
            casual: 'Relax while enjoying the story and puzzles.',
            'standard-moderno': 'Modern survival experience with balanced challenge.',
            'standard-clasico': 'Classic survival horror — limited resources and danger.',
            insanity: 'Unforgiving. Enemies are faster, resources are scarce. Only for the brave.'
        };
        modos.forEach(modo => {
            modo.addEventListener('click', () => {
                modos.forEach(m => m.classList.remove('activo'));
                modo.classList.add('activo');
                textoDescripcion.textContent = descripciones[modo.getAttribute('data-modo')];
            });
        });
        btnJugar.addEventListener('click', () => {
            window.location.href = 'juego.html';
        });
        document.addEventListener('keydown', (e) => {
            let activo = Array.from(modos).findIndex(m => m.classList.contains('activo'));
            if (e.key === 'ArrowUp' && activo > 0) {
                modos[activo].classList.remove('activo');
                modos[--activo].classList.add('activo');
                textoDescripcion.textContent = descripciones[modos[activo].getAttribute('data-modo')];
            }
            if (e.key === 'ArrowDown' && activo < modos.length - 1) {
                modos[activo].classList.remove('activo');
                modos[++activo].classList.add('activo');
                textoDescripcion.textContent = descripciones[modos[activo].getAttribute('data-modo')];
            }
            if (e.key === 'Enter') btnJugar.click();
        });
    </script>
</body>
</html>
