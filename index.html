/* =====================================================

#cover{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  justify-content:center;

  transition:

}

#cover.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.coverNoise{
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      0deg,

}

.coverVignette{

  inset:0;
  pointer-events:none;

.coverContent{

.smallWarning{

.gameTitle span{

  letter-spacing:clamp(4px,1.5vw,12px);

  margin-top:18px;

  color:#aaa;
}

.codeTitle{
  margin-top:25px;

  font-size:clamp(.7rem,2vw,1rem);

  color:#777;
}

.coverLine{

}

.coverWarning{
  color:#777;

  font-size:clamp(.6rem,1.8vw,.85rem);
  letter-spacing:3px;

  line-height:2;
}

.startButton{

/* =====================================================
   SISTEMA
===================================================== */

#system{

}

.room{

  inset:0;

  justify-content:center;
  align-items:center;

  background:
    radial-gradient(
      ellipse at center,
      #202020 0%,
      #0b0b0b 50%,
      #020202 100%

}

.monitor{
  position:relative;

  width:min(950px,96vw);
  height:min(740px,96vh);

  padding:14px;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #292929,
      #111 45%,
      #070707
    );

  box-shadow:
    0 35px 90px rgba(0,0,0,.95),
    inset 0 0 0 2px #333,
    inset 0 0 35px rgba(0,0,0,.95);
}

.screen{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:10px;

  background:
    radial-gradient(
      ellipse at center,
      #1d1d1d,
      #090909 70%,
      #030303
    );

  box-shadow:
    inset 0 0 55px rgba(0,0,0,.95);

  transition:
    background .4s,
    box-shadow .4s;
}

/* =====================================================
   EFECTO DE ERROR
===================================================== */

.screen.error1{
  background:
    radial-gradient(
      ellipse at center,
      rgba(95,0,0,.25),
      #090303 70%
    );
}

.screen.error2{
  background:
    radial-gradient(
      ellipse at center,
      rgba(130,0,0,.45),
      #120202 70%
    );
}

.screen.error3{

      ellipse at center,
      rgba(180,0,0,.62),

}

.screen.error4{
  background:
    radial-gradient(
      ellipse at center,
      rgba(220,0,0,.8),
      #230000 70%
    );
}

.screen.shake{
  animation:screenShake .35s;
}

.screen.redFlash{
  animation:redFlash .55s;
}

.screen::before{
  content:"";

  position:absolute;
  inset:0;

  z-index:20;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 2px,
      transparent 5px
    );
}

.screen::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:21;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0,0,0,.8) 100%
    );
}

.noise{
  position:absolute;
  inset:0;

  z-index:19;

  pointer-events:none;

  opacity:.06;

      0deg,
      transparent 0px,
      rgba(255,255,255,.35) 1px,

.interface{

/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes titleAppear{

  from{
    opacity:0;
    transform:scale(.9);
  }

  to{
    opacity:1;
    transform:scaleY(1.08);
  }

}

@keyframes flicker{

  0%,95%,100%{
    opacity:1;
  }

  96%{
    opacity:.4;
  }

  97%{
    opacity:1;
  }

}

@keyframes noiseMove{

  0%{
    transform:translateY(0);
  }

  100%{
    transform:translateY(5px);
  }

}

@keyframes scan{

  from{
    top:-5%;
  }

  to{
    top:105%;
  }

}

@keyframes blink{

  0%,45%,100%{
    opacity:1;
  }

  50%,55%{
    opacity:.2;
  }

}

@keyframes screenShake{

  0%,100%{
    transform:translate(0);
  }

  20%{
    transform:translate(-7px,2px);
  }

  40%{
    transform:translate(7px,-2px);
  }

  60%{
    transform:translate(-4px,1px);
  }

  80%{
    transform:translate(4px,-1px);
  }

}

@keyframes redFlash{

  0%{
    filter:brightness(1);
  }

  30%{
    filter:brightness(1.8);
  }

  100%{
    filter:brightness(1);
  }

}

function enterSystem(){

  const cover =

  const system =
    document.getElementById("system");

  cover.classList.add("hidden");

  setTimeout(() => {

    system.classList.add("active");

    showMainMenu();

  },700);

}

/* =====================================================
   ERROR VISUAL
===================================================== */

function triggerMistake(){

  mistakes++;

  const screen =
    document.getElementById("screen");

  screen.classList.remove(
    "error1",
    "error2",
    "error3",
    "error4",
    "shake",
    "redFlash"
  );

  void screen.offsetWidth;

  if(mistakes === 1){

    screen.classList.add("error1");

  }

  else if(mistakes === 2){

    screen.classList.add("error2");

  }

  else if(mistakes === 3){

    screen.classList.add("error3");

  }

  else{

    screen.classList.add("error4");

  }

  screen.classList.add("shake");
  screen.classList.add("redFlash");

}

  setContent(`

    <div class="mainMenu">

      <h1>
        ACCESS GRANTED
      </h1>

      <p>
        CLASSIFIED MEMORY
      </p>

      <p id="loadingText">
        RECUPERANDO MEMORIA...
      </p>

      <div
        id="secretContent"
        style="display:none;">

        <h2>
          ARCHIVO SECRETO
        </h2>

        <p>
          El primer mensaje.<br>
          Las primeras conversaciones.<br>
          Las primeras risas.<br>
          El día en que comenzó todo.
        </p>

        <h2>
          ⚠️ ANOMALÍA DETECTADA
        </h2>

        <p>
          El recuerdo más importante
          todavía no ha terminado de escribirse.
        </p>

        <p>
          Nuestra historia no terminó
          el 17 de mayo de 2026.
        </p>

        <p>
          Ese día solamente fue el comienzo.
        </p>

        <h2>
          ❤️ TÚ.
        </h2>

        <p>
          No existe una fecha para este recuerdo.
        </p>

        <p>
          Porque no pertenece al pasado.
        </p>

        <p>
          Sigue ocurriendo.
        </p>

        <h2>
          FIN DEL ARCHIVO.
        </h2>

        <p>
          ESTADO:
          ❤️ SIEMPRE.
        </p>

        <button onclick="showMemoryDatabase()">
          ← VOLVER
        </button>

        <button onclick="showFinalSystem()">
          ❤️ CONTINUAR
        </button>

      </div>

    </div>

  `);


  let progress = 0;

  const interval =
    setInterval(() => {

      progress += 20;

      const loading =
        document.getElementById(
          "loadingText"
        );

      if(!loading){

        clearInterval(interval);
        return;

      }

      loading.innerHTML =
        "RECUPERANDO MEMORIA... " +
        progress +
        "%";

      if(progress >= 100){

        clearInterval(interval);

        setTimeout(() => {

          loading.innerHTML =
            "🔓 MEMORIA RECUPERADA";

          setTimeout(() => {

            const secret =
              document.getElementById(
                "secretContent"
              );

            if(secret){
              secret.style.display = "block";
            }

          },1000);

        },500);

      }

    },500);

}
