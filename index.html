<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #1c1919 0%,
            #090707 45%,
            #020202 100%
        );

    color:#d6d6d6;

    font-family:'Share Tech Mono',monospace;

    transition:
        background .3s ease;
}


/* =====================================================
   CAPA DE DAÑO / ROJO
===================================================== */

#damageOverlay{

    position:fixed;

    inset:0;

    z-index:999;

    pointer-events:none;

    opacity:0;

    background:

        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(100,0,0,.2) 55%,
            rgba(170,0,0,.75) 100%
        );

    mix-blend-mode:screen;

    transition:
        opacity .25s ease;
}


#criticalOverlay{

    position:fixed;

    inset:0;

    z-index:998;

    pointer-events:none;

    opacity:0;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,0,0,.12) 0px,
            rgba(255,0,0,.12) 1px,
            transparent 2px,
            transparent 5px
        );

    transition:
        opacity .2s ease;
}


/* =====================================================
   ROOM
===================================================== */

.room{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* =====================================================
   MONITOR
===================================================== */

.monitor{

    position:relative;

    width:min(920px,95vw);

    height:min(750px,95vh);

    padding:18px;

    border-radius:22px;

    background:

        linear-gradient(
            145deg,
            #292929,
            #111 40%,
            #070707
        );

    box-shadow:

        0 45px 120px rgba(0,0,0,.95),

        inset 0 0 0 2px #353535,

        inset 0 0 35px rgba(0,0,0,.95);

    animation:
        monitorAppear 1.6s ease-out;
}


.monitor::before{

    content:"";

    position:absolute;

    inset:-5px;

    border-radius:27px;

    border:1px solid #3b3b3b;

    pointer-events:none;
}


.monitor::after{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:25px;

    pointer-events:none;

    box-shadow:
        0 0 30px rgba(110,0,0,.08);
}


/* =====================================================
   SCREEN
===================================================== */

.screen{

    position:relative;

    width:100%;

    height:100%;

    overflow:hidden;

    border-radius:12px;

    background:

        radial-gradient(
            ellipse at center,
            #262020 0%,
            #111 48%,
            #050505 100%
        );

    box-shadow:

        inset 0 0 60px rgba(0,0,0,.95),

        inset 0 0 15px rgba(255,255,255,.035);

    animation:
        screenFlicker 5s infinite;
}


/* CRT */

.screen::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:30;

    pointer-events:none;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode:screen;
}


.screen::after{

    content:"";

    position:absolute;

    inset:0;

    z-index:31;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.8) 100%
        );
}


/* =====================================================
   NOISE
===================================================== */

.noise{

    position:absolute;

    inset:0;

    z-index:20;

    pointer-events:none;

    opacity:.07;

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            rgba(255,255,255,.3) 1px,
            transparent 2px
        );

    animation:
        noiseMove .13s infinite;
}


.scanline{

    position:absolute;

    left:0;

    width:100%;

    height:2px;

    z-index:19;

    background:
        rgba(220,220,220,.08);

    box-shadow:
        0 0 14px rgba(255,255,255,.08);

    animation:
        scan 6s linear infinite;
}


/* =====================================================
   INTERFACE
===================================================== */

.interface{

    position:relative;

    z-index:10;

    height:100%;

    padding:5% 7%;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}


.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:
        clamp(.62rem,1.5vw,.88rem);

    letter-spacing:2px;

    color:#999;
}


.online{

    display:flex;

    align-items:center;

    gap:8px;
}


.indicator{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#861818;

    box-shadow:
        0 0 9px rgba(190,20,20,.9);

    animation:
        blink 2s infinite;
}


/* =====================================================
   CONTENT
===================================================== */

.content{

    text-align:center;

    width:100%;

    height:67%;

    overflow-y:auto;

    padding:20px;

    scrollbar-width:thin;

    scrollbar-color:#5a5a5a transparent;
}


.content::-webkit-scrollbar{
    width:5px;
}


.content::-webkit-scrollbar-thumb{
    background:#555;
}


/* =====================================================
   TITULOS
===================================================== */

.classification{

    color:#858585;

    font-size:
        clamp(.65rem,2vw,1rem);

    letter-spacing:4px;

    margin-bottom:18px;
}


.file-number{

    color:#b7b7b7;

    font-size:
        clamp(.62rem,1.5vw,.9rem);

    letter-spacing:3px;

    margin-bottom:8px;
}


.subject{

    position:relative;

    display:inline-block;

    font-size:
        clamp(2.7rem,11vw,6rem);

    letter-spacing:8px;

    font-weight:normal;

    color:#d7d7d7;

    text-shadow:

        0 0 10px rgba(255,255,255,.08),

        2px 0 rgba(130,0,0,.4);

    animation:
        subtleGlitch 6s infinite;
}


.status{

    margin-top:12px;

    font-size:
        clamp(.68rem,2vw,1rem);

    letter-spacing:3px;

    color:#a7a7a7;
}


.status strong{

    color:#a21f1f;

    font-weight:normal;
}


/* =====================================================
   WARNING
===================================================== */

.warning{

    margin-top:35px;

    display:inline-block;

    border:1px solid #571919;

    padding:14px 25px;

    color:#aaa;

    background:
        rgba(70,0,0,.09);

    box-shadow:

        inset 0 0 20px rgba(100,0,0,.08),

        0 0 15px rgba(80,0,0,.1);

    animation:
        warningPulse 3s infinite;
}


.warning-title{

    color:#a52222;

    font-size:.75rem;

    letter-spacing:3px;

    margin-bottom:8px;
}


.warning-text{

    font-size:
        clamp(.78rem,2vw,1rem);

    letter-spacing:1px;
}


/* =====================================================
   BOTONES
===================================================== */

button{

    padding:12px 22px;

    margin:7px;

    border:1px solid #626262;

    background:
        linear-gradient(
            180deg,
            rgba(30,30,30,.8),
            rgba(0,0,0,.7)
        );

    color:#d0d0d0;

    font-family:inherit;

    font-size:
        clamp(.68rem,2vw,.88rem);

    letter-spacing:2px;

    cursor:pointer;

    transition:

        background .2s ease,

        border .2s ease,

        transform .15s ease,

        box-shadow .2s ease;
}


button:hover{

    background:
        rgba(110,0,0,.25);

    border-color:#a12222;

    box-shadow:
        0 0 20px rgba(140,0,0,.3);

    transform:
        translateY(-2px);
}


button:active{

    transform:
        scale(.96);

    background:
        rgba(140,0,0,.35);
}


/* =====================================================
   MAIN MENU
===================================================== */

.mainMenu{

    width:100%;

    max-width:760px;

    margin:0 auto;

    padding:
        10px 5px 45px;
}


.mainMenu h1{

    color:#ddd;

    font-size:

    letter-spacing:3px;

    margin-bottom:15px;
}


.mainMenu h2{

    font-size:
        clamp(.95rem,3vw,1.5rem);

    letter-spacing:2px;

    margin:18px 0;
}


.mainMenu p{

    color:#b5b5b5;

    font-size:
        clamp(.76rem,2vw,.98rem);

    line-height:1.85;

    margin:10px auto;

    max-width:700px;
}


/* =====================================================
   TAGS
===================================================== */

.tag{

    display:inline-block;

    border:1px solid #4c4c4c;

    padding:6px 10px;

    margin:4px;

    font-size:.7rem;

    color:#aaa;

    background:

}


.tag.red{

    border-color:#721b1b;

    color:#b32b2b;
}


.tag.pink{

    border-color:#66364a;

    color:#c0809a;
}


/* =====================================================
   PROGRESS
===================================================== */

.progressBox{

    width:100%;

    max-width:500px;

    margin:25px auto;

    border:1px solid #444;

    padding:4px;
}


.progressBar{

    width:0%;

    height:12px;

    background:
        #7e1919;

    box-shadow:
        0 0 12px rgba(150,0,0,.4);

    transition:
        width .5s ease;
}


/* =====================================================
   ERROR
===================================================== */

.errorMessage{

    margin-top:20px;

    color:#a52222;

    min-height:30px;

    text-shadow:
        0 0 8px rgba(170,0,0,.5);

    animation:
        errorShake .25s;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#666;

    font-size:
        clamp(.52rem,1.3vw,.74rem);

    letter-spacing:2px;
}


.signal{

    display:flex;

    align-items:center;

    gap:8px;
}


.bars{

    display:flex;

    gap:2px;
}


.bar{

    width:4px;

    height:10px;

    background:#555;
}


.bar:nth-child(4){

    background:#8f1717;
}


/* =====================================================
   DAMAGE LEVELS
===================================================== */

.damage-1 #damageOverlay{
    opacity:.12;
}

.damage-2 #damageOverlay{
    opacity:.22;
}

.damage-3 #damageOverlay{
    opacity:.34;
}

.damage-4 #damageOverlay{
    opacity:.48;
}

.damage-5 #damageOverlay{
    opacity:.65;
}

.damage-critical #damageOverlay{
    opacity:.82;
}


.damage-critical #criticalOverlay{
    opacity:.4;
}


.damage-critical .screen{
    animation:
        criticalFlicker .18s infinite;
}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes monitorAppear{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


@keyframes screenFlicker{

    0%,100%{
        opacity:1;
    }

    48%{
        opacity:1;
    }

    49%{
        opacity:.94;
    }

    50%{
        opacity:1;
    }

    83%{
        opacity:1;
    }

    84%{
        opacity:.96;
    }
}


@keyframes criticalFlicker{

    0%{
        filter:
            contrast(1)
            brightness(1);
    }

    25%{
        filter:
            contrast(1.4)
            brightness(.75);
    }

    50%{
        filter:
            contrast(1.8)
            brightness(1.1);
    }

    75%{
        filter:
            contrast(1.3)
            brightness(.7);
    }

    100%{
        filter:
            contrast(1)
            brightness(1);
    }
}


@keyframes noiseMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(4px);
    }
}


@keyframes scan{

    from{
        top:-5%;
    }

    to{
        top:105%;
    }
}


@keyframes blink{

    0%,45%{
        opacity:1;
    }

    50%,55%{
        opacity:.25;
    }

    60%,100%{
        opacity:1;
    }
}


@keyframes warningPulse{

    0%,100%{
        opacity:.85;
    }

    50%{
        opacity:1;
    }
}


@keyframes subtleGlitch{

    0%,94%,100%{
        transform:translateX(0);
    }

    95%{
        transform:translateX(-2px);
    }

    96%{
        transform:translateX(2px);
    }

    97%{
        transform:translateX(0);
    }
}


@keyframes errorShake{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    50%{
        transform:translateX(6px);
    }

    75%{
        transform:translateX(-4px);
    }

    100%{
        transform:translateX(0);
    }
}


/* =====================================================
   MOBILE
===================================================== */

    }

    button{

        width:92%;

        margin:6px auto;

        display:block;
    }

    .content{
        padding:12px 5px;
    }
}

</style>

/* =====================================================
   SONIDO RESIDENT EVIL STYLE
===================================================== */

function playErrorSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(
            90,
            ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            35,
            ctx.currentTime + .3
        );

        gain.gain.setValueAtTime(
            .08,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .3
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .3
        );

    }catch(e){}
}


function playSuccessSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            440,
            ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            880,
            ctx.currentTime + .25
        );

        gain.gain.setValueAtTime(
            .06,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .3
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .3
        );

    }catch(e){}
}

/* =====================================================
   RESPUESTA INCORRECTA
===================================================== */

function answerWrong(){

    wrongAnswers++;

    updateDamage();

    playErrorSound();


    const message =
        document.getElementById(
            "gameMessage"
        );


    if(message){

        let warning = "";


        if(wrongAnswers === 1){

            warning =
                "⚠️ PRIMERA FALLA DETECTADA.";

        }else if(wrongAnswers === 2){

            warning =
                "⚠️ INESTABILIDAD DEL SISTEMA.";

        }else if(wrongAnswers === 3){

            warning =
                "🔴 ALERTA: INTEGRIDAD COMPROMETIDA.";

        }else if(wrongAnswers === 4){

            warning =
                "🔴 ERROR CRÍTICO: SISTEMA INESTABLE.";

        }else if(wrongAnswers === 5){

            warning =
                "🩸 BIOHAZARD WARNING: DAMAGE CRITICAL.";

        }else{

            warning =
                "☠️ TERMINAL FAILURE — RECONSIDERA TU RESPUESTA.";
        }


        message.innerHTML = `

            ❌ RESPUESTA INCORRECTA

            <br><br>

            ${warning}

            <br><br>

            El registro no coincide.

            <br><br>

            <span style="color:#7e1b1b">
                NIVEL DE DAÑO:
                ${wrongAnswers}
            </span>

            <br><br>

            Vuelve a intentarlo 😭

        `;


        message.classList.remove(
            "errorMessage"
        );

        void message.offsetWidth;

        message.classList.add(
            "errorMessage"
        );
    }
}
