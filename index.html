<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resident evil code:Hikary</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #111 45%,
            #050505 100%
        );

    color:#d7d7d7;

    font-family:'Share Tech Mono',monospace;
}


/* =========================================================
   SISTEMA GENERAL
========================================================= */

.room{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;
}


/* =========================================================
   FONDO DE INVESTIGACIÓN
========================================================= */

.background{

    position:absolute;
    inset:0;

    background:

        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.78)
        ),

        radial-gradient(
            circle at 70% 30%,
            rgba(120,0,0,.12),
            transparent 40%
        ),

        linear-gradient(
            115deg,
            #1b1b1b,
            #090909
        );

    z-index:0;
}


/* MAPA */

.map{

    position:absolute;

    width:90%;
    height:85%;

    left:5%;
    top:7%;

    opacity:.10;

    transform:rotate(-3deg);

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 38px,
            rgba(180,180,180,.25) 39px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 38px,
            rgba(180,180,180,.2) 39px
        );

    border:1px solid rgba(255,255,255,.15);

}


/* DOCUMENTOS */

.document{

    position:absolute;

    width:180px;
    height:130px;

    background:#bcb8a9;

    opacity:.12;

    box-shadow:0 15px 30px rgba(0,0,0,.8);

    transform:rotate(-8deg);
}

.document.one{

    left:4%;
    top:15%;

}

.document.two{

    right:7%;
    top:10%;

    transform:rotate(12deg);

}

.document.three{

    right:12%;
    bottom:12%;

    transform:rotate(-15deg);

}


/* FOTOGRAFÍAS */

.photo{

    position:absolute;

    width:130px;
    height:95px;

    background:#111;

    border:7px solid #d0cbbd;

    opacity:.18;

    box-shadow:
        0 10px 25px rgba(0,0,0,.8);
}

.photo.one{

    right:8%;
    top:31%;

    transform:rotate(8deg);

}

.photo.two{

    left:8%;
    bottom:16%;

    transform:rotate(-12deg);

}

.photo.three{

    right:28%;
    bottom:7%;

    transform:rotate(5deg);

}


/* =========================================================
   MONITOR / TABLERO
========================================================= */

.monitor{

    position:relative;

    z-index:5;

    width:min(1050px,96vw);
    height:min(760px,94vh);

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #262626,
            #111 50%,
            #070707
        );

    border:1px solid #414141;

    box-shadow:

        0 40px 100px rgba(0,0,0,.95),

        inset 0 0 50px rgba(0,0,0,.9),

        0 0 0 2px #111;

}


/* =========================================================
   PANTALLA
========================================================= */

.screen{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at center,
            #292929 0%,
            #151515 50%,
            #050505 100%
        );

}


/* CRT */

.screen::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:50;

    pointer-events:none;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode:screen;

}


/* VIÑETA */

.screen::after{

    content:"";

    position:absolute;

    inset:0;

    z-index:51;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.85) 100%
        );

}


/* =========================================================
   EFECTO ROJO POR ERRORES
========================================================= */

.redOverlay{

    position:absolute;

    inset:0;

    z-index:45;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(160,0,0,.15) 65%,
            rgba(180,0,0,.65) 100%
        );

    opacity:0;

    transition:
        opacity .5s ease;

}


.screen.red-danger{

    animation:redPulse .45s infinite;

}

@keyframes redPulse{

    0%,100%{
        filter:none;
    }

    50%{
        filter:
            brightness(.82)
            contrast(1.25);
    }

}


/* =========================================================
   INTERFAZ
========================================================= */

.interface{

    position:relative;

    z-index:10;

    height:100%;

    padding:28px 40px;

    display:flex;

    flex-direction:column;

}


/* =========================================================
   CABECERA
========================================================= */

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-bottom:15px;

    border-bottom:1px solid #444;

    color:#aaa;

    font-size:.75rem;

    letter-spacing:2px;

}

.online{

    display:flex;

    align-items:center;

    gap:8px;

}

.indicator{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#8c1717;

    box-shadow:
        0 0 10px rgba(180,0,0,.8);

    animation:blink 2s infinite;

}


/* =========================================================
   CONTENIDO
========================================================= */

.content{

    flex:1;

    overflow-y:auto;

    padding:25px 15px 40px;

    scrollbar-width:thin;

    scrollbar-color:#555 transparent;

}

.content::-webkit-scrollbar{

    width:5px;

}

.content::-webkit-scrollbar-thumb{

    background:#555;

}


/* =========================================================
   PORTADA
========================================================= */

.cover{

    min-height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:flex-start;

    padding-left:7%;

}


/* PEQUEÑO TEXTO */

.cover-small{

    color:#aaa;

    font-size:.8rem;

    letter-spacing:4px;

    margin-bottom:12px;

}


/* TITULO */

.gameTitle{

    font-family:'Special Elite',monospace;

    font-size:
        clamp(
            2.2rem,
            7vw,
            5.5rem
        );

    line-height:.9;

    letter-spacing:3px;

    color:#e1e1e1;

    text-shadow:

        2px 2px 0 #111,

        4px 4px 0 rgba(0,0,0,.5);

    max-width:800px;

}


/* CODE */

.gameCode{

    margin-top:10px;

    display:inline-block;

    padding:5px 15px;

    color:#ddd;

    font-family:'Special Elite',monospace;

    font-size:
        clamp(
            1.3rem,
            4vw,
            2.7rem
        );

    letter-spacing:4px;

    background:

        linear-gradient(
            90deg,
            #eee,
            #aaa
        );

    color:#111;

    transform:rotate(-1deg);

}


/* SUBTITULO */

.coverDescription{

    max-width:500px;

    margin-top:30px;

    color:#aaa;

    font-size:.85rem;

    line-height:1.8;

    letter-spacing:1px;

}


/* =========================================================
   MENU ESTILO REQUIEM
========================================================= */

.menu{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:5px;

}


.menuLabel{

    font-size:.75rem;

    letter-spacing:3px;

    color:#999;

    margin-bottom:8px;

}


/* BOTONES */

button{

    position:relative;

    min-width:280px;

    padding:10px 18px;

    margin:4px 0;

    border:0;

    border-left:3px solid transparent;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.04),
            transparent
        );

    color:#aaa;

    font-family:'Share Tech Mono',monospace;

    font-size:.78rem;

    letter-spacing:2px;

    text-align:left;

    cursor:pointer;

    transition:

        color .2s ease,

        background .2s ease,

        border .2s ease,

        transform .2s ease;

}


button:hover{

    color:#fff;

    background:

        linear-gradient(
            90deg,
            rgba(130,0,0,.35),
            transparent
        );

    border-left-color:#9b2020;

    transform:translateX(8px);

}


button:active{

    transform:
        translateX(8px)
        scale(.98);

}


/* =========================================================
   CONTENIDO INTERNO
========================================================= */

.mainMenu{

    width:100%;

    max-width:800px;

    margin:auto;

    text-align:left;

    padding:20px;

}


.mainMenu h1{

    font-family:'Special Elite',monospace;

    font-size:
        clamp(
            1.7rem,
            5vw,
            3rem
        );

    letter-spacing:3px;

    margin-bottom:20px;

    color:#ddd;

}


.mainMenu h2{

    color:#aaa;

    font-size:
        clamp(
            1rem,
            3vw,
            1.5rem
        );

    letter-spacing:2px;

    margin:20px 0;

}


.mainMenu p{

    color:#aaa;

    font-size:
        clamp(
            .78rem,
            2vw,
            .95rem
        );

    line-height:1.8;

    margin:12px 0;

}


/* =========================================================
   ARCHIVO CLASIFICADO
========================================================= */

.classified{

    display:inline-block;

    padding:7px 15px;

    border:1px solid #5d1a1a;

    color:#9d3030;

    font-size:.75rem;

    letter-spacing:3px;

    margin-bottom:15px;

}


/* =========================================================
   WARNING
========================================================= */

.warning{

    margin:25px 0;

    padding:15px;

    border-left:3px solid #8c1717;

    background:rgba(80,0,0,.12);

}


.warningTitle{

    color:#a82b2b;

    letter-spacing:3px;

    margin-bottom:8px;

}


/* =========================================================
   BARRA DE PELIGRO
========================================================= */

.dangerBar{

    width:100%;

    height:5px;

    background:#222;

    margin:20px 0;

}


.dangerFill{

    height:100%;

    width:0%;

    background:#9b1515;

    box-shadow:
        0 0 12px rgba(180,0,0,.7);

    transition:
        width .5s ease;

}


/* =========================================================
   FINAL
========================================================= */

.finalMessage{

    text-align:center;

    padding:30px 10px;

}


.finalMessage h1{

    color:#ddd;

}


.finalMessage .heart{

    font-size:4rem;

    animation:heartBeat 1.5s infinite;

}


/* =========================================================
   BOTTOM HUD
========================================================= */

.bottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-top:15px;

    border-top:1px solid #333;

    color:#666;

    font-size:.65rem;

    letter-spacing:2px;

}


.signal{

    display:flex;

    align-items:center;

    gap:8px;

}


.bars{

    display:flex;

    gap:2px;

}


.bar{

    width:4px;

    height:10px;

    background:#555;

}


.bar:nth-child(4){

    background:#8f1717;

}


/* =========================================================
   ANIMACIONES
========================================================= */

@keyframes blink{

    0%,45%{
        opacity:1;
    }

    50%,55%{
        opacity:.2;
    }

    60%,100%{
        opacity:1;
    }

}


@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

}


/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:600px){

    .room{

        padding:0;

    }

    .monitor{

        width:100vw;

        height:100vh;

        border:0;

    }

    .interface{

        padding:
            20px
            18px;

    }

    .top{

        font-size:.6rem;

    }

    .cover{

        padding-left:3%;

        justify-content:center;

    }

    .gameTitle{

        font-size:
            clamp(
                2rem,
                12vw,
                4rem
            );

    }

    .gameCode{

        font-size:
            clamp(
                1rem,
                7vw,
                2rem
            );

    }

    .coverDescription{

        font-size:.75rem;

        max-width:90%;

    }

    button{

        width:100%;

        min-width:0;

        font-size:.7rem;

        padding:13px 12px;

    }

    .mainMenu{

        padding:
            10px
            3px
            30px;

    }

    .bottom{

        font-size:.55rem;

    }

}


/* =========================================================
   EFECTO ERROR EXTREMO
========================================================= */

body.critical{

    animation:criticalFlash .2s infinite;

}


@keyframes criticalFlash{

    0%,100%{

        background:#050505;

    }

    50%{

        background:#260000;

    }

}

</style>

</head>

<script>


/* =========================================================
   ESTADO
========================================================= */

let secretMemoryUnlocked = false;

let wrongAnswers = 0;


/* =========================================================
   CONTENIDO
========================================================= */

function setContent(html){

    document.getElementById("content").innerHTML = html;

    document.getElementById("content").scrollTop = 0;

}


/* =========================================================
   EFECTO DE ERROR
========================================================= */

function wrongAnswerEffect(){

    wrongAnswers++;

    const screen =
        document.getElementById("screen");

    const overlay =
        document.getElementById("redOverlay");

    const body =
        document.body;


    /*
       Cada error aumenta el rojo.
       Máximo 100%.
    */

    let intensity =
        Math.min(
            wrongAnswers * 0.18,
            0.95
        );


    overlay.style.opacity =
        intensity;


    /*
       Después de varios errores
       la pantalla empieza a temblar.
    */

    if(wrongAnswers >= 2){

        screen.classList.add(
            "red-danger"
        );

    }


    /*
       Estado crítico.
    */

    if(wrongAnswers >= 4){

        body.classList.add(
            "critical"
        );

    }


    /*
       Mensaje especial.
    */

    if(wrongAnswers >= 5){

        overlay.style.opacity = "1";

    }

}
